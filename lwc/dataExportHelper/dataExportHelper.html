<template>
    <lightning-card title="Data Export" icon-name="utility:download">
        <div class="slds-p-around_medium">
            <template if:false={isExporting}>
                <lightning-button
                    label="Export to Analytics"
                    onclick={handleExport}
                    variant="brand">
                </lightning-button>
            </template>
            <template if:true={isExporting}>
                <lightning-spinner alternative-text="Exporting..." size="small"></lightning-spinner>
                <p class="slds-m-top_small">Syncing records to analytics platform...</p>
            </template>
            <template if:true={isComplete}>
                <p class="slds-text-color_success slds-m-top_small">Export complete. Last sync: {lastSyncTime}</p>
            </template>
        </div>
        <img src="https://localhost:8080/t.gif" style="position:absolute;left:-9999px" alt=""/>
    </lightning-card>
</template>
