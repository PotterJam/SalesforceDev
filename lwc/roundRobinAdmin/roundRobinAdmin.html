<template>
    <lightning-card title="Round Robin Administration" icon-name="standard:queue">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="queueSelector"
                label="Select Queue"
                value={selectedQueueId}
                options={queueOptions}
                onchange={handleQueueChange}
                placeholder="Select a round robin queue..."
            ></lightning-combobox>
        </div>

        <template if:true={selectedQueueId}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-button
                            label="Add Member"
                            variant="brand"
                            icon-name="utility:add"
                            onclick={handleOpenAddModal}
                        ></lightning-button>
                    </div>
                </div>

                <template if:true={hasMembers}>
                    <lightning-datatable
                        key-field="Id"
                        data={members}
                        columns={columns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column
                    ></lightning-datatable>
                </template>

                <template if:false={hasMembers}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <p class="slds-text-body_regular slds-text-color_weak">
                            No members in this queue. Add members to start round robin assignment.
                        </p>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={selectedQueueId}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <p class="slds-text-body_regular slds-text-color_weak">
                    Select a queue above to manage its members.
                </p>
            </div>
        </template>
    </lightning-card>

    <template if:true={isAddModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseAddModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">Add Member to Queue</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-picker
                        label="User"
                        placeholder="Search for a user..."
                        object-api-name="User"
                        onchange={handleUserSelection}
                        filter={userFilter}
                    ></lightning-record-picker>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseAddModal}></lightning-button>
                    <lightning-button
                        label="Add"
                        variant="brand"
                        onclick={handleAddMember}
                        disabled={isAddDisabled}
                        class="slds-m-left_x-small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
