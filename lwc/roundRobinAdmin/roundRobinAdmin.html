<template>
    <lightning-card title="Round Robin Administration" icon-name="standard:lead">
        <template if:false={config}>
            <div class="slds-p-around_medium">
                <lightning-illustration header="No Active Configuration" sub-header="Create and activate a Round Robin Config record to get started.">
                </lightning-illustration>
            </div>
        </template>

        <template if:true={config}>
            <div class="slds-p-horizontal_medium slds-p-top_small">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12" class="slds-p-bottom_small">
                        <p class="slds-text-heading_small">
                            Config: <strong>{config.Name}</strong>
                        </p>
                    </lightning-layout-item>
                </lightning-layout>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <lightning-layout>
                    <lightning-layout-item flexibility="auto" class="slds-p-right_small">
                        <lightning-input
                            type="search"
                            label="Search Users"
                            placeholder="Type a name to search..."
                            value={searchTerm}
                            onchange={handleSearchChange}>
                        </lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="no-flex" alignment-bump="left" class="slds-p-top_large">
                        <lightning-button
                            label="Add Selected User"
                            variant="brand"
                            onclick={handleAddMember}
                            disabled={isAddDisabled}>
                        </lightning-button>
                    </lightning-layout-item>
                </lightning-layout>
            </div>

            <template if:true={userSearchResults.length}>
                <div class="slds-p-horizontal_medium slds-p-bottom_small">
                    <lightning-datatable
                        key-field="Id"
                        data={userSearchResults}
                        columns={userColumns}
                        selected-rows={selectedUserRows}
                        onrowselection={handleUserSelection}
                        max-row-selection="1"
                        hide-checkbox-column={false}>
                    </lightning-datatable>
                </div>
            </template>

            <div class="slds-p-horizontal_medium">
                <lightning-datatable
                    key-field="Id"
                    data={members}
                    columns={memberColumns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </lightning-card>
</template>
